    <style>
        body{

            margin: 20px auto;
        }
        #claculator{
            width: 320px;

            background-color: #eaedef;
            margin: 0 auto;
            top: 20px;
            position: relative;
            border-radius: 5px;
            box-shadow: 4px 8px 6px rgba(0,0,0,0.2), 6px 20px 6px rgba(0,0,0,0.19);

            color: #919191;
        }
        #output{
            text-align: right;
            height: 60px;
            margin: 10px 20px;
            font-size: 30px;
        }
        #keyboard{
            height: 400px;
        }
        .operator, .number, .empty{
            width: 50px;
            height: 50px;
            margin: 15px;
            float: left;
            border-radius: 50%;
            border-width: 0;
            font-weight: bold;
            font-size: 15px;
        }
        .number, .empty{
            background-color: #eaedef;
        }
        .number, .operator{
            cursor: pointer;
        }
        .operator:active, .number:active{
            font-size: 13px;
        }
        .operator:focus, .number:focus, .empty:focus{
            outline: 0;
        }
        button:nth-child(4){
            font-size: 20px;
            background-color: #2eb2aa;
        }
        button:nth-child(8){

        button:nth-child(12){

        }
        button:nth-child(16){

            background-color: #7d93e0;
        }
        button:nth-child(20){

            background-color: #9477af;
        }
    </style>

</head>
