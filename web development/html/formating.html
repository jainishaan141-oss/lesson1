<!DOCTYPE html>

<head>
   
    <title>formating in html</title>
</head>
<body>
    <p>this is a <b>bold</b>paragraph</p>
    <p>this is a <i>italic</i>paragraph</p>
    <p>this is a <sub>subscript</sub>paragraph</p>
    <p>this is a <sup>superscript</sup>paragraph</p>
    <p>this is a <del>delated</del>paragraph</p>
    <p>this is a <ins>inserted</ins>paragraph</p>
</body>
</html>
