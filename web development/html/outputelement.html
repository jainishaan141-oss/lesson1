<!DOCTYPE html>

<head>
 
    <title>output element in html</title>
</head>
<body>
    <form action="/action_page.php"
    output="x.value=parse.int(a.value) + parse.int(b.value)">
    <input type="number" id="a" name="a" value="75">
    <input type="number" id="b" name="b" value="50">
    <output name="x" for="a+b"></output><br><br>
</form>
</body>
</html>
