<!DOCTYPE html>

<head>
    
    <title>select element in html</title>
</head>
<body>
    <form>
        <label>choose a car:</label>
        <select name="cars" id="cars">
           <option value="volvo">volvo</option>
           <option value="bmw">bmw</option>
           <option value="mercedes">mercedes</option>
        </select>
    </form>
</body>
</html>
