<!DOCTYPE html>

<head>
    
    <title>fieldset and legend element in html</title>
</head>
<body>
    <h3>this is a form</h3>

    <form>
        <fieldset>
            <legend><h3>personal details</h3></legend>
            <label>name</label><br>
            <input type="text" id="name"><br>
            <label>age</label><br>
            <input type="text" id="age"><br>
            <button>submit</button>
        </fieldset>
    </form>
</body>
</html>
