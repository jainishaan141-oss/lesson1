<!DOCTYPE html>

<head>
    <title>opacity in html</title>
    <style>
        .div{
            width: 100px;
            height: 50px;
            padding: 25px;
            margin: 15px;
            color: beige;
            background-color: cyan;
        }
        .box1{
            opacity: 1;
        }
        .box2{
            opacity: 0.5;
        }
        .box3{
            opacity: 0;
        }
    </style>
</head>
<body>
    
    <div  class="box1">opacity 1(fully visible)</div>
    <div class="box2">opacity 0.5(semi visible)</div>
    <div class="box3">opacity 0(invisible)</div>
</body>
</html>
