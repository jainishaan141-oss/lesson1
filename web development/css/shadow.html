<!DOCTYPE html>

<head>
    
    <title>text shadow, box shadow, text inded</title>
    <style>
        h1 {
            text-shadow: 2px 3px 4px red;
        }
        div {
            box-shadow: 5px 6px 5px skyblue;
            padding: 50px;
        }
        p {
            text-indent: 50px;
        }

    </style>
</head>
<body>
    <h1>this is an example of text shadow</h1>
    <div></div>
    <p>this is an example of text inded</p>
</body>
</html>
