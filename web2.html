<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" />
    <script src="https://kit.fontawesome.com/996973c893.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+Tamma+2:wght@400;500;600;700;800&family=Roboto+Slab:wght@200;400;600;900&display=swap"
        rel="stylesheet">
    <meta charset="UTF-8">

    <title>Document</title>

    <style>
        footer {
            background: #2b2b2b;
            width: 100%;

        footer .container {

        footer h5 {
            margin: 0;
            font-size: 14px;
            font-weight: 500;
            color: #8b8b8b;
        }

        footer a {
            color: #f2a900 !important;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
        body{

        font-family: "Barlow TT", sans-serif;
    }

    #project h1{
        font-weight: 900;
    }

    .card{
        border: 0;
        border-radius: 3px;
        box-shadow: 0px 6px 18px rgba(0, 0, 0, .35);
    }

    .card-img-top{
        padding: 13px;
        height: 13rem;
        object-fit: contain;
    }

    .card-text{

    .btn-warning{
        font-weight: 700;
        font-size: 8rem;
